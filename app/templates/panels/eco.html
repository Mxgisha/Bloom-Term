<table class="t macro">
  <colgroup>
    <col style="width:38%"><col style="width:26%"><col style="width:16%"><col style="width:20%">
  </colgroup>
  <thead><tr><th>series</th><th class="num">last</th><th class="num">chg</th><th></th></tr></thead>
  <tbody>
    {% for r in rows %}
    <tr>
      <td class="mname">{{ r.label }}</td>
      <td class="num {{ r.dir }}">{{ r.q.last|price }}{{ r.unit }}</td>
      <td class="num {{ r.dir }}">{{ r.q.pct|pct }}</td>
      <td class="sp"><svg viewBox="0 0 66 14" width="66" height="14" aria-hidden="true">
        <path d="{{ r.spark }}" fill="none" stroke="#5d6670" stroke-width="1"
              vector-effect="non-scaling-stroke"/></svg></td>
    </tr>
    {% endfor %}
  </tbody>
</table>
