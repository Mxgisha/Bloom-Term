<div class="sub">gainers</div>
<table class="t movers">
  <colgroup><col style="width:72px"><col><col style="width:54px"><col style="width:84px"><col style="width:76px"></colgroup>
  <tbody>
    {% for r in gainers %}
    <tr>
      <td class="sym">{{ r.q.sym }}</td>
      <td></td>
      <td class="sp"><svg viewBox="0 0 54 16" width="54" height="16" aria-hidden="true">
        <path d="{{ r.spark }}" fill="none" stroke="#4bb36b" stroke-width="1"
              vector-effect="non-scaling-stroke"/></svg></td>
      <td class="num">{{ r.q.last|price }}</td>
      <td class="num up">{{ r.q.pct|pct }}</td>
    </tr>
    {% endfor %}
  </tbody>
</table>
<div class="sub">losers</div>
<table class="t movers">
  <colgroup><col style="width:72px"><col><col style="width:54px"><col style="width:84px"><col style="width:76px"></colgroup>
  <tbody>
    {% for r in losers %}
    <tr>
      <td class="sym">{{ r.q.sym }}</td>
      <td></td>
      <td class="sp"><svg viewBox="0 0 54 16" width="54" height="16" aria-hidden="true">
        <path d="{{ r.spark }}" fill="none" stroke="#d9534f" stroke-width="1"
              vector-effect="non-scaling-stroke"/></svg></td>
      <td class="num">{{ r.q.last|price }}</td>
      <td class="num down">{{ r.q.pct|pct }}</td>
    </tr>
    {% endfor %}
  </tbody>
</table>
