<ul class="news">
  {% for n in items %}
  <li>
    {% if n.url %}
    <a class="news-row" href="{{ n.url }}" target="_blank" rel="noopener noreferrer"
       data-syms="{{ n.syms|join(' ') }}">
      <span class="t">{{ n.t|hhmm }}</span>
      <span class="src">{{ n.src }}</span>
      <span class="hl">{{ n.headline }}</span>
    </a>
    {% else %}
    <div class="news-row" data-syms="{{ n.syms|join(' ') }}">
      <span class="t">{{ n.t|hhmm }}</span>
      <span class="src">{{ n.src }}</span>
      <span class="hl">{{ n.headline }}</span>
    </div>
    {% endif %}
  </li>
  {% endfor %}
</ul>
