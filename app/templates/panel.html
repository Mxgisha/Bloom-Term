<section class="panel{% if active %} active{% endif %}" id="panel-{{ i }}" data-fn="{{ fn }}"
         data-sym="{{ sym }}" data-range="{{ range }}" data-poll="{{ poll }}" tabindex="0">
  <header class="p-head">
    <span class="p-code">{{ fn }}</span>
    <span class="p-title">{{ title }}</span>
    <span class="p-meta">{{ meta }}</span>
  </header>
  <div class="p-body">{{ body }}</div>
</section>
