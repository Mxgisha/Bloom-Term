[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "bloomterm"
version = "0.3.0"
description = "A keyboard-first market terminal: six panels, a command line, one process."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "jinja2>=3.1",
    "yfinance>=1.0",
    "websocket-client>=1.7",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff==0.17.5"]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
# Broad excepts at provider boundaries are deliberate: one dead feed must not take the
# page down. Each is scoped to a single fetch or panel and rendered as an error state.
