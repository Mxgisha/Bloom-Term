name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: install
        run: pip install -e ".[dev]"
      - name: lint
        run: ruff check app tests run.py
      - name: format
        run: ruff format --check app tests run.py
      - name: test
        run: pytest -q
